version: '2'
services:
  config-server:
    deploy:
      resources:
        limits:
          memory: 512M
    container_name: config-server
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - curl
      - -I
      - http://config-server:8888
      timeout: 5s
    image: springcommunity/spring-petclinic-config-server
    ports:
    - 8888:8888
  discovery-server:
    deploy:
      resources:
        limits:
          memory: 512M
    container_name: discovery-server
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - curl
      - -f
      - http://discovery-server:8761
      timeout: 3s
    image: springcommunity/spring-petclinic-discovery-server
    ports:
    - 8761:8761
  admin-server:
    deploy:
      resources:
        limits:
          memory: 512M
    container_name: admin-server
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    image: springcommunity/spring-petclinic-admin-server
    ports:
    - 9090:9090
    x-connects_to:
    - customers-service
    - visits-service
    - vets-service
    - api-gateway
  tracing-server:
    deploy:
      resources:
        limits:
          memory: 512M
    container_name: tracing-server
    environment:
    - JAVA_OPTS=-XX:+UnlockExperimentalVMOptions -Djava.security.egd=file:/dev/./urandom
    image: openzipkin/zipkin
    ports:
    - 9411:9411
  grafana-server:
    deploy:
      resources:
        limits:
          memory: 256M
    container_name: grafana-server
    image: grafana/grafana
    ports:
    - 3000:3000
    x-connects_to:
    - prometheus-server
  prometheus-server:
    deploy:
      resources:
        limits:
          memory: 256M
    container_name: prometheus-server
    image: prom/prometheus
    ports:
    - 9091:9090
    x-connects_to:
    - customers-service
    - visits-service
    - vets-service
    - api-gateway
  customers-service:
    deploy:
      resources:
        limits:
          memory: 512M
    container_name: customers-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      tracing-server:
        condition: service_started
    environment:
    - SPRING_ZIPKIN_BASEURL=http://tracing-server:9411
    image: springcommunity/spring-petclinic-customers-service
    ports:
    - 8081:8081
  visits-service:
    deploy:
      resources:
        limits:
          memory: 512M
    container_name: visits-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      tracing-server:
        condition: service_started
    environment:
    - SPRING_ZIPKIN_BASEURL=http://tracing-server:9411
    image: springcommunity/spring-petclinic-visits-service
    ports:
    - 8082:8082
  vets-service:
    deploy:
      resources:
        limits:
          memory: 512M
    container_name: vets-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      tracing-server:
        condition: service_started
    environment:
    - SPRING_ZIPKIN_BASEURL=http://tracing-server:9411
    image: springcommunity/spring-petclinic-vets-service
    ports:
    - 8083:8083
  api-gateway:
    deploy:
      resources:
        limits:
          memory: 512M
    container_name: api-gateway
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      tracing-server:
        condition: service_started
    environment:
    - SPRING_ZIPKIN_BASEURL=http://tracing-server:9411
    image: springcommunity/spring-petclinic-api-gateway
    ports:
    - 8080:8080
    x-connects_to:
    - customers-service
    - visits-service
    - vets-service
networks: {}

