kind: Deployment
metadata:
  labels:
    app: copy_train-ticket
    service: rabbitmq
  name: rabbitmq
spec:
  template:
    metadata:
      labels:
        app: copy_train-ticket
        service: rabbitmq
    spec:
      hostname: rabbitmq
      containers:
      - image: rabbitmq:management
        ports:
        - containerPort: 5672
        - containerPort: 15672
        name: rabbitmq
  selector:
    matchLabels:
      app: copy_train-ticket
      service: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_train-ticket
    service: rabbitmq
  name: rabbitmq
spec:
  ports:
  - port: 5672
    name: port-5672
    targetPort: 5672
  - port: 15672
    name: port-15672
    targetPort: 15672
  selector:
    app: copy_train-ticket
    service: rabbitmq
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_train-ticket
    service: rabbitmq
  name: rabbitmq
spec:
  rules:
  - http:
      paths:
      - path: /copy_train-ticket/rabbitmq
        backend:
          service:
            port:
              number: 5672
            name: rabbitmq
        pathType: Prefix
      - path: /copy_train-ticket/rabbitmq
        backend:
          service:
            port:
              number: 15672
            name: rabbitmq
        pathType: Prefix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_train-ticket
    service: ts-voucher-mysql
  name: ts-voucher-mysql
spec:
  template:
    metadata:
      labels:
        app: copy_train-ticket
        service: ts-voucher-mysql
    spec:
      hostname: ts-voucher-mysql
      containers:
      - image: mysql:5.7
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: root
        ports:
        - containerPort: 3306
        name: ts-voucher-mysql
        readinessProbe:
          failureThreshold: 10
          periodSeconds: 30
          timeoutSeconds: 5
          initialDelaySeconds: 5
          exec:
            command:
            - mysqladmin
            - ping
            - -uroot
            - -proot
  selector:
    matchLabels:
      app: copy_train-ticket
      service: ts-voucher-mysql
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_train-ticket
    service: ts-voucher-mysql
  name: ts-voucher-mysql
spec:
  ports:
  - port: 3306
    name: port-3306
    targetPort: 3306
  selector:
    app: copy_train-ticket
    service: ts-voucher-mysql

