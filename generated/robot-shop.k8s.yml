            - 'X-INSTANA-SYNTHETIC: 1'
            - -f
            - http://localhost/_health
      initContainers:
      - image: opsfleet/depends-on
        args:
        - -service=mysql
        name: wait-for-services
  selector:
    matchLabels:
      app: copy_robot-shop
      service: ratings
