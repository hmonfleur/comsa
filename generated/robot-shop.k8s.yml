apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_robot-shop
    service: catalogue
  name: catalogue
spec:
  template:
    metadata:
      labels:
        app: copy_robot-shop
        service: catalogue
    spec:
      hostname: catalogue
      containers:
      - image: robotshop/rs-catalogue:latest
        ports:
        - containerPort: 8080
        name: catalogue
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 10
          timeoutSeconds: 10
          initialDelaySeconds: 5
          exec:
            command:
            - curl
            - -H
            - 'X-INSTANA-SYNTHETIC: 1'
            - -f
            - http://localhost:8080/health
      initContainers:
      - image: opsfleet/depends-on
        args:
        - -service=mongodb
        name: wait-for-services
  selector:
    matchLabels:
      app: copy_robot-shop
      service: catalogue
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_robot-shop
    service: catalogue
  name: catalogue
spec:
  ports:
  - port: 8080
    name: port-8080
    targetPort: 8080
  selector:
    app: copy_robot-shop
    service: catalogue
---
