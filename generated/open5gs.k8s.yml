apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_open5gs
    service: mongo
  name: mongo
spec:
  template:
    metadata:
      labels:
        app: copy_open5gs
        service: mongo
    spec:
      hostname: mongo
      containers:
      - image: mongo
        env:
        - name: MONGO_INITDB_DATABASE
          value: open5gs
        ports:
        - protocol: UDP
          containerPort: 27017
        - protocol: TCP
          containerPort: 27017
        name: mongo
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 5
          timeoutSeconds: 5
          initialDelaySeconds: 5
          exec:
            command:
            - mongosh
            - --eval
            - db.adminCommand('ping')
  selector:
    matchLabels:
      app: copy_open5gs
      service: mongo
