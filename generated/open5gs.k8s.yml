apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_open5gs
    service: nrf
  name: nrf
spec:
  template:
    metadata:
      labels:
        app: copy_open5gs
        service: nrf
    spec:
      hostname: nrf
      containers:
      - image: gradiant/open5gs:2.7.0
        ports:
        - protocol: TCP
          containerPort: 7777
        args:
        - open5gs-nrfd
        name: nrf
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 5
          timeoutSeconds: 5
          initialDelaySeconds: 5
          exec:
            command:
            - grep
            - NRF initialize...done
            - var/log/open5gs/nrf.log
  selector:
    matchLabels:
      app: copy_open5gs
      service: nrf
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_open5gs
    service: nrf
  name: nrf
spec:
  ports:
  - protocol: TCP
    port: 7777
    name: port-7777-tcp
    targetPort: 7777
  selector:
    app: copy_open5gs
    service: nrf
---
