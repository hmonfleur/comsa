apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_qbike
    service: uc
  name: uc
spec:
  template:
    metadata:
      labels:
        app: copy_qbike
        service: uc
    spec:
      hostname: uc
      containers:
      - image: club.newtech/uc
        env:
        - name: EUREKA_HOST
          value: eureka
        - name: DB_HOST
          value: mysql
        - name: DB_SCHEMA
          value: qbike
        - name: REDIS_HOST
          value: redis
        - name: REDIS_DB
          value: '0'
        - name: RABBIT
          value: rabbit
        ports:
        - containerPort: 8000
        name: uc
      initContainers:
      - image: opsfleet/depends-on
        args:
        - -service=rabbit
        - -service=redis
        - -service=mysql
        - -service=eureka
        - -service=zipkin
        name: wait-for-services
  selector:
    matchLabels:
      app: copy_qbike
      service: uc
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_qbike
    service: uc
  name: uc
spec:
  ports:
  - port: 8000
    name: port-8000
    targetPort: 8000
  selector:
    app: copy_qbike
    service: uc
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_qbike
    service: uc
  name: uc
spec:
  rules:
  - http:
      paths:
      - path: /copy_qbike/uc
        backend:
          service:
            port:
              number: 8000
            name: uc
        pathType: Prefix
