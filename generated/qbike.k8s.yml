apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_qbike
    service: rabbit
  name: rabbit
spec:
  template:
    metadata:
      labels:
        app: copy_qbike
        service: rabbit
    spec:
      hostname: rabbit
      containers:
      - image: rabbitmq:3-management
        env:
        - name: RABBITMQ_ERLANG_COOKIE
          value: SWQOKODSQALRPCLNMEQG
        - name: RABBITMQ_DEFAULT_USER
          value: guest
        - name: RABBITMQ_DEFAULT_PASS
          value: guest
        - name: RABBITMQ_DEFAULT_VHOST
          value: /
        ports:
        - containerPort: 15672
        - containerPort: 5672
        name: rabbit
  selector:
    matchLabels:
      app: copy_qbike
      service: rabbit
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_qbike
    service: rabbit
  name: rabbit
spec:
  ports:
  - port: 15672
    name: port-15672
    targetPort: 15672
  - port: 5672
    name: port-5672
    targetPort: 5672
  selector:
    app: copy_qbike
    service: rabbit
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
