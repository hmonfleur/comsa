apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_qbike
    service: mysql
  name: mysql
spec:
  template:
    metadata:
      labels:
        app: copy_qbike
        service: mysql
    spec:
      hostname: mysql
      volumes:
      - name: volume-0
      - name: volume-1
      - name: volume-2
      containers:
      - image: mysql:5.7
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: root
        ports:
        - containerPort: 13306
        volumeMounts:
        - mountPath: /docker-entrypoint-initdb.d
          name: volume-0
        - mountPath: /etc/mysql/conf.d
          name: volume-1
        - mountPath: /var/lib/mysql
          name: volume-2
        name: mysql
  selector:
    matchLabels:
      app: copy_qbike
      service: mysql
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_qbike
    service: mysql
  name: mysql
spec:
  ports:
  - port: 13306
    name: port-13306
    targetPort: 3306
  selector:
    app: copy_qbike
    service: mysql
