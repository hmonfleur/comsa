apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_graphprocessing
    service: graphdb
  name: graphdb
spec:
  template:
    metadata:
      labels:
        app: copy_graphprocessing
        service: graphdb
    spec:
      hostname: graphdb
      volumes:
      - emptyDir: {}
        name: volume-0
      containers:
      - image: kbastani/docker-neo4j:latest
        ports:
        - containerPort: 7474
        - containerPort: 1337
        volumeMounts:
        - mountPath: /opt/data
          name: volume-0
        name: graphdb
      initContainers:
      - image: opsfleet/depends-on
        args:
        - -service=hdfs
        name: wait-for-services
  selector:
    matchLabels:
      app: copy_graphprocessing
      service: graphdb
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_graphprocessing
    service: graphdb
  name: graphdb
spec:
  ports:
  - port: 7474
    name: port-7474
    targetPort: 7474
  - port: 1337
    name: port-1337
    targetPort: 1337
  selector:
    app: copy_graphprocessing
    service: graphdb
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_graphprocessing
    service: graphdb
  name: graphdb
spec:
  rules:
  - http:
      paths:
      - path: /copy_graphprocessing/graphdb
        backend:
          service:
            port:
              number: 7474
            name: graphdb
        pathType: Prefix
      - path: /copy_graphprocessing/graphdb
        backend:
          service:
            port:
              number: 1337
            name: graphdb
        pathType: Prefix
