apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_graphprocessing
    service: discovery
  name: discovery
spec:
  template:
    metadata:
      labels:
        app: copy_graphprocessing
        service: discovery
    spec:
      hostname: discovery
      containers:
      - image: kbastani/twitter-discovery:latest
        ports:
        - containerPort: 8761
        name: discovery
      initContainers:
      - image: opsfleet/depends-on
        args:
        - -service=config
        name: wait-for-services
  selector:
    matchLabels:
      app: copy_graphprocessing
      service: discovery
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_graphprocessing
    service: discovery
  name: discovery
spec:
  ports:
  - port: 8761
    name: port-8761
    targetPort: 8761
  selector:
    app: copy_graphprocessing
    service: discovery
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_graphprocessing
    service: discovery
  name: discovery
spec:
  rules:
  - http:
      paths:
      - path: /copy_graphprocessing/discovery
        backend:
          service:
            port:
              number: 8761
            name: discovery
        pathType: Prefix
---
