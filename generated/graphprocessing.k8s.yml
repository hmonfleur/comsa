apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_graphprocessing
    service: twitter-rank-crawler
  name: twitter-rank-crawler
spec:
  template:
    metadata:
      labels:
        app: copy_graphprocessing
        service: twitter-rank-crawler
    spec:
      hostname: crawler
      containers:
      - image: kbastani/twitter-rank-crawler:latest
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: production
        - name: SPRING_SOCIAL_TWITTER_ACCESSTOKENSECRET
          value: REPLACE
        - name: SPRING_SOCIAL_TWITTER_ACCESSTOKEN
          value: REPLACE
        - name: SPRING_SOCIAL_TWITTER_APPSECRET
          value: REPLACE
        - name: SPRING_SOCIAL_TWITTER_APPID
          value: REPLACE
        ports:
        - containerPort: 8080
        name: twitter-rank-crawler
      initContainers:
      - image: opsfleet/depends-on
        args:
        - -service=discovery
        - -service=config
        - -service=graphdb
        - -service=rabbit
        name: wait-for-services
  selector:
    matchLabels:
      app: copy_graphprocessing
      service: twitter-rank-crawler
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_graphprocessing
    service: twitter-rank-crawler
  name: twitter-rank-crawler
spec:
  ports:
  - port: 8080
    name: port-8080
    targetPort: 8080
  selector:
    app: copy_graphprocessing
    service: twitter-rank-crawler
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_graphprocessing
    service: twitter-rank-crawler
  name: twitter-rank-crawler
spec:
  rules:
  - http:
