apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_graphprocessing
    service: scope
  name: scope
spec:
  template:
    metadata:
      labels:
        app: copy_graphprocessing
        service: scope
    spec:
      hostname: weave-scope
      volumes:
      - name: volume-0
        hostPath:
          path: /var/run/
      containers:
      - image: weaveworks/scope:0.13.0
        securityContext:
          privileged: true
        ports:
        - containerPort: 4040
        volumeMounts:
        - mountPath: /var/run
          name: volume-0
        args:
        - --probe.docker
        - 'true'
        name: scope
  selector:
    matchLabels:
      app: copy_graphprocessing
      service: scope
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_graphprocessing
    service: scope
  name: scope
spec:
  ports:
  - port: 4040
    name: port-4040
    targetPort: 4040
  selector:
    app: copy_graphprocessing
    service: scope
