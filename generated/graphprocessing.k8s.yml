apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_graphprocessing
    service: twitter-rank-web
  name: twitter-rank-web
spec:
  template:
    metadata:
      labels:
        app: copy_graphprocessing
        service: twitter-rank-web
    spec:
      hostname: dashboard
      containers:
      - image: kbastani/twitter-rank-web:latest
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: production
        ports:
        - containerPort: 8081
        name: twitter-rank-web
      initContainers:
      - image: opsfleet/depends-on
        args:
        - -service=discovery
        - -service=config
        name: wait-for-services
  selector:
    matchLabels:
      app: copy_graphprocessing
      service: twitter-rank-web
---
