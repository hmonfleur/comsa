apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_deathstarbench_hotelreservation_multiconcerns
    service: consul
  name: consul
spec:
  template:
    metadata:
      labels:
        app: copy_deathstarbench_hotelreservation_multiconcerns
        service: consul
    spec:
      hostname: consul
      containers:
      - image: hashicorp/consul:latest
        ports:
        - containerPort: 8300
        - containerPort: 8400
        - containerPort: 8500
        - protocol: UDP
          containerPort: 8600
        name: consul
  selector:
    matchLabels:
      app: copy_deathstarbench_hotelreservation_multiconcerns
      service: consul
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_deathstarbench_hotelreservation_multiconcerns
    service: consul
  name: consul
spec:
  ports:
  - port: 8300
    name: port-8300
    targetPort: 8300
  - port: 8400
    name: port-8400
    targetPort: 8400
  - port: 8500
    name: port-8500
    targetPort: 8500
  - protocol: UDP
    port: 8600
    name: port-8600-udp
    targetPort: 53
  selector:
    app: copy_deathstarbench_hotelreservation_multiconcerns
    service: consul
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_deathstarbench_hotelreservation_multiconcerns
    service: consul
  name: consul
spec:
  rules:
  - http:
      paths:
      - path: /copy_deathstarbench_hotelreservation_multiconcerns/consul
        backend:
          service:
            port:
              number: 8300
            name: consul
        pathType: Prefix
      - path: /copy_deathstarbench_hotelreservation_multiconcerns/consul
        backend:
          service:
            port:
              number: 8400
            name: consul
        pathType: Prefix
      - path: /copy_deathstarbench_hotelreservation_multiconcerns/consul
        backend:
          service:
            port:
              number: 8500
            name: consul
        pathType: Prefix
      - path: /copy_deathstarbench_hotelreservation_multiconcerns/consul
        backend:
          service:
            port:
              number: 8600
            name: consul
        pathType: Prefix
---
