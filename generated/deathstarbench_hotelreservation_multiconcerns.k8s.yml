    app: copy_deathstarbench_hotelreservation_multiconcerns
    service: mongodb-rate
  name: mongodb-rate
spec:
  ports:
  - port: 27017
    name: port-27017
    targetPort: 27017
  selector:
    app: copy_deathstarbench_hotelreservation_multiconcerns
    service: mongodb-rate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_deathstarbench_hotelreservation_multiconcerns
    service: mongodb-recommendation
  name: mongodb-recommendation
spec:
  template:
    metadata:
      labels:
        app: copy_deathstarbench_hotelreservation_multiconcerns
        service: mongodb-recommendation
    spec:
      hostname: hotel-reserv-recommendation-mongo
      volumes:
      - name: volume-0
      containers:
      - image: mongo:4.4.6
        env:
        - name: MEMCACHED_CACHE_SIZE
          value: '128'
        - name: MEMCACHED_THREADS
          value: '2'
        ports:
        - containerPort: 27017
        volumeMounts:
        - mountPath: /data/db
          name: volume-0
        name: mongodb-recommendation
  selector:
    matchLabels:
      app: copy_deathstarbench_hotelreservation_multiconcerns
      service: mongodb-recommendation
---
