apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_deathstarbench_mediamicroservices_multiconcerns
    service: dns-media
  name: dns-media
spec:
  template:
    metadata:
      labels:
        app: copy_deathstarbench_mediamicroservices_multiconcerns
        service: dns-media
    spec:
      hostname: dns-media
      volumes:
      - name: volume-0
        hostPath:
          path: /opt/dns-proxy-server/conf
      - name: volume-1
        hostPath:
          path: /var/run/docker.sock
      - name: volume-2
        hostPath:
          path: /etc/resolv.conf
      containers:
      - image: defreitas/dns-proxy-server
        ports:
        - containerPort: 53
        volumeMounts:
        - mountPath: /app/conf
          name: volume-0
        - mountPath: /var/run/docker.sock
          name: volume-1
        - mountPath: /etc/resolv.conf
          name: volume-2
        name: dns-media
  selector:
    matchLabels:
      app: copy_deathstarbench_mediamicroservices_multiconcerns
      service: dns-media
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_deathstarbench_mediamicroservices_multiconcerns
