apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_deathstarbench_mediamicroservices_multiconcerns
    service: nginx-web-server
  name: nginx-web-server
spec:
  template:
    metadata:
      labels:
        app: copy_deathstarbench_mediamicroservices_multiconcerns
        service: nginx-web-server
    spec:
      hostname: nginx-thrift
      volumes:
      - name: volume-0
      - name: volume-1
      - name: volume-2
      - name: volume-3
      containers:
      - image: yg/openresty-thrift:xenial
        ports:
        - containerPort: 8080
        volumeMounts:
        - mountPath: /usr/local/openresty/nginx/lua-scripts
          name: volume-0
        - mountPath: /usr/local/openresty/nginx/conf/nginx.conf
          name: volume-1
        - mountPath: /usr/local/openresty/nginx/jaeger-config.json
          name: volume-2
        - mountPath: /gen-lua
          name: volume-3
        name: nginx-web-server
      initContainers:
      - image: opsfleet/depends-on
        args:
        - -service=cast-info-service
        - -service=movie-info-service
        - -service=user-service
        - -service=text-service
        - -service=movie-id-service
        - -service=unique-id-service
        - -service=plot-service
        name: wait-for-services
  selector:
    matchLabels:
      app: copy_deathstarbench_mediamicroservices_multiconcerns
      service: nginx-web-server
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_deathstarbench_mediamicroservices_multiconcerns
    service: nginx-web-server
  name: nginx-web-server
spec:
  ports:
  - port: 8080
    name: port-8080
    targetPort: 8080
  selector:
    app: copy_deathstarbench_mediamicroservices_multiconcerns
    service: nginx-web-server

