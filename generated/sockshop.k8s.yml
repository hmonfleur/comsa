apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_sockshop
    service: front-end
  name: front-end
spec:
  template:
    metadata:
      labels:
        app: copy_sockshop
        service: front-end
    spec:
      hostname: front-end
      containers:
      - image: weaveworksdemos/front-end:0.3.12
        securityContext:
          capabilities:
            drop:
            - all
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 8079
        name: front-end
  selector:
    matchLabels:
      app: copy_sockshop
      service: front-end
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_sockshop
    service: front-end
  name: front-end
spec:
  ports:
  - port: 8079
    name: port-8079
    targetPort: 8079
  selector:
    app: copy_sockshop
    service: front-end
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_sockshop
    service: edge-router
  name: edge-router
spec:
  template:
    metadata:
      labels:
        app: copy_sockshop
        service: edge-router
    spec:
      hostname: edge-router
      volumes:
      - emptyDir:
          medium: Memory
        name: tmpfs-0
      containers:
      - image: weaveworksdemos/edge-router:0.1.1
        securityContext:
          capabilities:
            add:
            - DAC_OVERRIDE
            - CHOWN
            - SETGID
            - SETUID
            - NET_BIND_SERVICE
            drop:
            - all
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 80
        - containerPort: 8080
        volumeMounts:
        - mountPath: /var/run
          name: tmpfs-0
        name: edge-router
  selector:
    matchLabels:
      app: copy_sockshop
      service: edge-router
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_sockshop
    service: edge-router
  name: edge-router
spec:
  ports:
  - port: 80
    name: port-80
    targetPort: 80
  - port: 8080
    name: port-8080
    targetPort: 8080
  selector:
    app: copy_sockshop
    service: edge-router
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_sockshop
    service: edge-router
  name: edge-router
spec:
  rules:
  - http:
      paths:
      - path: /copy_sockshop/edge-router
        backend:
          service:
            port:
              number: 80
            name: edge-router
        pathType: Prefix
      - path: /copy_sockshop/edge-router
        backend:
          service:
            port:
              number: 8080
            name: edge-router
        pathType: Prefix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_sockshop
    service: catalogue
  name: catalogue
spec:
  template:
    metadata:
      labels:
        app: copy_sockshop
        service: catalogue
    spec:
      hostname: catalogue
      containers:
      - image: weaveworksdemos/catalogue:0.3.5
        securityContext:
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - all
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 80
        name: catalogue
      initContainers:
      - image: opsfleet/depends-on
        args:
        - -service=catalogue-db
        name: wait-for-services
  selector:
    matchLabels:
      app: copy_sockshop
      service: catalogue
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_sockshop
    service: catalogue
  name: catalogue
spec:
  ports:
  - port: 80
    name: port-80
    targetPort: 80
  selector:
    app: copy_sockshop
    service: catalogue
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_sockshop
    service: catalogue-db
  name: catalogue-db
spec:
  template:
    metadata:
      labels:
        app: copy_sockshop
        service: catalogue-db
    spec:
      hostname: catalogue-db
      containers:
      - image: weaveworksdemos/catalogue-db:0.3.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: ${MYSQL_ROOT_PASSWORD}
        - name: MYSQL_ALLOW_EMPTY_PASSWORD
          value: 'true'
        - name: MYSQL_DATABASE
          value: socksdb
        ports:
        - containerPort: 3306
        name: catalogue-db
  selector:
    matchLabels:
      app: copy_sockshop
      service: catalogue-db
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_sockshop
    service: catalogue-db
