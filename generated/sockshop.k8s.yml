apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_sockshop
    service: carts
  name: carts
spec:
  template:
    metadata:
      labels:
        app: copy_sockshop
        service: carts
    spec:
      hostname: carts
      volumes:
      - emptyDir:
          medium: Memory
        name: tmpfs-0
      containers:
      - image: weaveworksdemos/carts:0.4.8
        securityContext:
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - all
          readOnlyRootFilesystem: true
        env:
        - name: JAVA_OPTS
          value: -Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: /tmp
          name: tmpfs-0
        name: carts
      initContainers:
      - image: opsfleet/depends-on
        args:
        - -service=carts-db
        name: wait-for-services
  selector:
    matchLabels:
      app: copy_sockshop
      service: carts
---
