services:
  discovery:
    container_name: discovery
    depends_on:
      config:
        condition: service_started
    image: kbastani/twitter-discovery:latest
    ports:
    - 8761:8761
  config:
    container_name: config
    image: kbastani/twitter-configuration:latest
    ports:
    - 8888:8888
  mazerunner:
    container_name: mazerunner
    depends_on:
      hdfs:
        condition: service_started
    image: kbastani/neo4j-graph-analytics:latest
  graphdb:
    container_name: graphdb
    depends_on:
      hdfs:
        condition: service_started
    image: kbastani/docker-neo4j:latest
    links:
    - mazerunner
    ports:
    - 7474:7474
    - 1337:1337
    volumes:
    - /opt/data
  twitter-rank-web:
    container_name: dashboard
    depends_on:
      discovery:
        condition: service_started
      config:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: production
    image: kbastani/twitter-rank-web:latest
    ports:
    - 8081:8081
  twitter-rank-crawler:
    container_name: crawler
    depends_on:
      discovery:
        condition: service_started
      config:
        condition: service_started
      graphdb:
        condition: service_started
      rabbit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_SOCIAL_TWITTER_ACCESSTOKENSECRET: REPLACE
      SPRING_SOCIAL_TWITTER_ACCESSTOKEN: REPLACE
      SPRING_SOCIAL_TWITTER_APPSECRET: REPLACE
      SPRING_SOCIAL_TWITTER_APPID: REPLACE
    image: kbastani/twitter-rank-crawler:latest
    ports:
    - 8080:8080
  hdfs:
    command: /etc/bootstrap.sh -d -bash
    container_name: hdfs
    image: sequenceiq/hadoop-docker:2.4.1
    ports:
    - '22'
    - 8030-8033
    - '8040'
    - '8042'
    - '8088'
    - '49707'
    - '50010'
    - '50020'
    - '50070'
    - '50075'
    - '50090'
  rabbit:
    container_name: rabbit
    image: rabbitmq:3
    ports:
    - 5672:5672
    - 15672:15672
  scope:
    command:
    - --probe.docker
    - 'true'
    container_name: weave-scope
    image: weaveworks/scope:0.13.0
    labels:
    - works.weave.role=system
    pid: host
    ports:
    - 4040:4040
    privileged: true
    tty: true
    volumes:
    - /var/run/:/var/run:rw
    x-connects_to:
    - discovery
    - config
    - hdfs
    - mazerunner
    - graphdb
    - rabbit
    - twitter-rank-web
    - twitter-rank-crawler
networks: {}

