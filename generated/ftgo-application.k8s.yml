apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_ftgo-application
    service: ftgo-consumer-service
  name: ftgo-consumer-service
spec:
  template:
    metadata:
      labels:
        app: copy_ftgo-application
        service: ftgo-consumer-service
    spec:
      hostname: ftgo-consumer-service
      containers:
      - image: odidev/ftgo-application_ftgo-consumer-service
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql/ftgo_consumer_service
        - name: SPRING_DATASOURCE_USERNAME
          value: ftgo_consumer_service_user
        - name: SPRING_DATASOURCE_PASSWORD
          value: ftgo_consumer_service_password
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: com.mysql.jdbc.Driver
        - name: EVENTUATE_DATABASE_SCHEMA
          value: ftgo_consumer_service
        - name: EVENTUATELOCAL_ZOOKEEPER_CONNECTION_STRING
          value: zookeeper:2181
        - name: EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS
          value: kafka:29092
        ports:
        - containerPort: 8081
        name: ftgo-consumer-service
      initContainers:
      - image: opsfleet/depends-on
        args:
        - -service=zookeeper
        - -service=kafka
        - -service=mysql
        - -service=cdc-service
        name: wait-for-services
  selector:
    matchLabels:
      app: copy_ftgo-application
      service: ftgo-consumer-service
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_ftgo-application
    service: ftgo-consumer-service
  name: ftgo-consumer-service
spec:
  ports:
  - port: 8081
    name: port-8081
    targetPort: 8080
  selector:
    app: copy_ftgo-application
    service: ftgo-consumer-service
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_ftgo-application
    service: ftgo-consumer-service
  name: ftgo-consumer-service
spec:
  rules:
  - http:
      paths:
      - path: /copy_ftgo-application/ftgo-consumer-service
        backend:
          service:
            port:
              number: 8081
            name: ftgo-consumer-service
        pathType: Prefix
