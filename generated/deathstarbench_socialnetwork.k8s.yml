apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_deathstarbench_socialnetwork
    service: nginx-thrift
  name: nginx-thrift
spec:
  template:
    metadata:
      labels:
        app: copy_deathstarbench_socialnetwork
        service: nginx-thrift
    spec:
      hostname: nginx-thrift
      volumes:
      - name: volume-0
      - name: volume-1
      - name: volume-2
      - name: volume-3
      - name: volume-4
      - name: volume-5
      containers:
      - image: yg397/openresty-thrift:xenial
        ports:
        - containerPort: 8080
        volumeMounts:
        - mountPath: /usr/local/openresty/nginx/lua-scripts
          name: volume-0
        - mountPath: /usr/local/openresty/nginx/pages
          name: volume-1
        - mountPath: /usr/local/openresty/nginx/conf/nginx.conf
          name: volume-2
        - mountPath: /usr/local/openresty/nginx/jaeger-config.json
          name: volume-3
        - mountPath: /gen-lua
          name: volume-4
        - mountPath: /usr/local/openresty/lualib/thrift
          name: volume-5
        name: nginx-thrift
  selector:
    matchLabels:
      app: copy_deathstarbench_socialnetwork
      service: nginx-thrift
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_deathstarbench_socialnetwork
    service: nginx-thrift
  name: nginx-thrift
spec:
  ports:
  - port: 8080
    name: port-8080
    targetPort: 8080
  selector:
    app: copy_deathstarbench_socialnetwork
    service: nginx-thrift
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_deathstarbench_socialnetwork
    service: nginx-thrift
  name: nginx-thrift
spec:
  rules:
  - http:
      paths:
      - path: /copy_deathstarbench_socialnetwork/nginx-thrift
        backend:
          service:
            port:
              number: 8080
            name: nginx-thrift
        pathType: Prefix
---
