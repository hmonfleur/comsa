apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_microcompany
    service: my-rabbit
  name: my-rabbit
spec:
  template:
    metadata:
      labels:
        app: copy_microcompany
        service: my-rabbit
    spec:
      hostname: rabbitmq
      containers:
      - image: rabbitmq:3-management
        securityContext:
          privileged: true
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: test
        - name: RABBITMQ_DEFAULT_PASS
          value: password
        - name: RABBITMQ_NODENAME
          value: my-rabbit
        ports:
        - containerPort: 5672
        - containerPort: 15672
        name: my-rabbit
  selector:
    matchLabels:
      app: copy_microcompany
      service: my-rabbit
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_microcompany
    service: my-rabbit
  name: my-rabbit
spec:
  ports:
  - port: 5672
    name: port-5672
    targetPort: 5672
  - port: 15672
    name: port-15672
    targetPort: 15672
  selector:
    app: copy_microcompany
    service: my-rabbit
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_microcompany
    service: my-rabbit
  name: my-rabbit
spec:
  rules:
  - http:
      paths:
      - path: /copy_microcompany/my-rabbit
        backend:
          service:
            port:
              number: 5672
            name: my-rabbit
        pathType: Prefix
      - path: /copy_microcompany/my-rabbit
        backend:
          service:
            port:
              number: 15672
            name: my-rabbit
        pathType: Prefix

