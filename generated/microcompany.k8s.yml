apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_microcompany
    service: configserver
  name: configserver
spec:
  template:
    metadata:
      labels:
        app: copy_microcompany
        service: configserver
    spec:
      hostname: configserver
      containers:
      - image: idugalic/configserver
        ports:
        - containerPort: 8888
        name: configserver
  selector:
    matchLabels:
      app: copy_microcompany
      service: configserver
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_microcompany
    service: configserver
  name: configserver
spec:
  ports:
  - port: 8888
    name: port-8888
    targetPort: 8888
  selector:
    app: copy_microcompany
    service: configserver
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_microcompany
    service: configserver
  name: configserver
spec:
  rules:
  - http:
      paths:
      - path: /copy_microcompany/configserver
        backend:
          service:
            port:
              number: 8888
            name: configserver
        pathType: Prefix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_microcompany
    service: registry
  name: registry
spec:
  template:
    metadata:
      labels:
        app: copy_microcompany
        service: registry
    spec:
      hostname: registry
      containers:
      - image: idugalic/registry
        env:
        - name: HOST_IP
          value: $DOCKER_HOST_IP
        ports:
        - containerPort: 8761
        command:
        - ./wait-for-it.sh
        - configserver:8888
        - -t
        - '60'
        - --
        args:
        - java
        - -Dspring.profiles.active=docker
        - -jar
        - /app.jar
        name: registry
      initContainers:
      - image: opsfleet/depends-on
        args:
        - -service=configserver
        name: wait-for-services
  selector:
    matchLabels:
      app: copy_microcompany
      service: registry
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_microcompany
    service: registry
  name: registry
spec:
  ports:
  - port: 8761
    name: port-8761
    targetPort: 8761
  selector:
    app: copy_microcompany
    service: registry
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_microcompany
    service: registry
  name: registry
spec:
  rules:
  - http:
      paths:
      - path: /copy_microcompany/registry
        backend:
          service:
            port:
              number: 8761
            name: registry
        pathType: Prefix
