apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_PetClinic
    service: config-server
  name: config-server
spec:
  template:
    metadata:
      labels:
        app: copy_PetClinic
        service: config-server
    spec:
      hostname: config-server
      containers:
      - image: springcommunity/spring-petclinic-config-server
        resources:
          limits:
            memory: 512M
        ports:
        - containerPort: 8888
        name: config-server
        readinessProbe:
          failureThreshold: 10
          periodSeconds: 5
          timeoutSeconds: 5
          initialDelaySeconds: 5
          exec:
            command:
            - curl
            - -I
            - http://config-server:8888
  selector:
    matchLabels:
      app: copy_PetClinic
      service: config-server
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_PetClinic
    service: config-server
  name: config-server
spec:
  ports:
  - port: 8888
    name: port-8888
    targetPort: 8888
  selector:
    app: copy_PetClinic
    service: config-server
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_PetClinic
    service: config-server
  name: config-server
spec:
  rules:
  - http:
      paths:
      - path: /copy_PetClinic/config-server
        backend:
          service:
            port:
              number: 8888
            name: config-server
        pathType: Prefix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_PetClinic
    service: discovery-server
  name: discovery-server
spec:
  template:
    metadata:
      labels:
        app: copy_PetClinic
        service: discovery-server
    spec:
      hostname: discovery-server
      containers:
      - image: springcommunity/spring-petclinic-discovery-server
        resources:
          limits:
            memory: 512M
        ports:
        - containerPort: 8761
        name: discovery-server
        readinessProbe:
          failureThreshold: 10
          periodSeconds: 5
          timeoutSeconds: 3
          initialDelaySeconds: 5
          exec:
            command:
            - curl
            - -f
            - http://discovery-server:8761
      initContainers:
      - image: opsfleet/depends-on
        args:
        - -service=config-server
        name: wait-for-services
  selector:
    matchLabels:
      app: copy_PetClinic
      service: discovery-server
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_PetClinic
    service: discovery-server
  name: discovery-server
spec:
  ports:
  - port: 8761
    name: port-8761
    targetPort: 8761
  selector:
    app: copy_PetClinic
    service: discovery-server
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_PetClinic
    service: discovery-server
  name: discovery-server
spec:
  rules:
  - http:
      paths:
      - path: /copy_PetClinic/discovery-server
        backend:
          service:
            port:
              number: 8761
            name: discovery-server
        pathType: Prefix
