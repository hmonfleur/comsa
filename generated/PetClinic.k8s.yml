apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_PetClinic
    service: tracing-server
  name: tracing-server
spec:
  template:
    metadata:
      labels:
        app: copy_PetClinic
        service: tracing-server
    spec:
      hostname: tracing-server
      containers:
      - image: openzipkin/zipkin
        resources:
          limits:
            memory: 512M
        env:
        - name: JAVA_OPTS
          value: -XX:+UnlockExperimentalVMOptions -Djava.security.egd=file:/dev/./urandom
        ports:
        - containerPort: 9411
        name: tracing-server
  selector:
    matchLabels:
      app: copy_PetClinic
      service: tracing-server
---
apiVersion: v1
