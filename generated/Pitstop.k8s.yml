apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_Pitstop
    service: vehiclemanagementapi
  name: vehiclemanagementapi
spec:
  template:
    metadata:
      labels:
        app: copy_Pitstop
        service: vehiclemanagementapi
    spec:
      hostname: vehiclemanagementapi
      containers:
      - image: pitstop/vehiclemanagementapi:1.0
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        ports:
        - containerPort: 5000
        name: vehiclemanagementapi
      initContainers:
      - image: opsfleet/depends-on
        args:
        - -service=rabbitmq
        - -service=sqlserver
        - -service=logserver
        name: wait-for-services
  selector:
    matchLabels:
      app: copy_Pitstop
      service: vehiclemanagementapi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_Pitstop
    service: vehiclemanagementapi
  name: vehiclemanagementapi
spec:
  ports:
  - port: 5000
    name: port-5000
    targetPort: 5000
  selector:
    app: copy_Pitstop
    service: vehiclemanagementapi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_Pitstop
    service: vehiclemanagementapi
  name: vehiclemanagementapi
spec:
  rules:
  - http:
      paths:
      - path: /copy_Pitstop/vehiclemanagementapi
        backend:
          service:
            port:
              number: 5000
            name: vehiclemanagementapi
        pathType: Prefix
