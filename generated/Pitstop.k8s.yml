    app: copy_Pitstop
    service: rabbitmq
  name: rabbitmq
spec:
  template:
    metadata:
      labels:
        app: copy_Pitstop
        service: rabbitmq
    spec:
      hostname: rabbitmq
      volumes:
      - name: volume-0
      containers:
      - image: rabbitmq:3-management-alpine
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: rabbitmquser
        - name: RABBITMQ_DEFAULT_PASS
          value: DEBmbwkSrzy9D1T9cJfa
        ports:
        - containerPort: 15672
        - containerPort: 5672
        volumeMounts:
        - mountPath: /var/lib/rabbitmq
          name: volume-0
        name: rabbitmq
  selector:
    matchLabels:
      app: copy_Pitstop
      service: rabbitmq
---
