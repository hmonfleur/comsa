apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_CQRS
    service: config
  name: config
spec:
  template:
    metadata:
      labels:
        app: copy_CQRS
        service: config
    spec:
      hostname: config
      containers:
      - image: benwilcock/config-service
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: production
        ports:
        - containerPort: 8888
        name: config
  selector:
    matchLabels:
      app: copy_CQRS
      service: config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_CQRS
    service: config
  name: config
spec:
  ports:
  - port: 8888
    name: port-8888
    targetPort: 8888
  selector:
    app: copy_CQRS
    service: config
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_CQRS
    service: config
  name: config
spec:
  rules:
  - http:
      paths:
      - path: /copy_CQRS/config
        backend:
          service:
            port:
              number: 8888
            name: config
        pathType: Prefix
---
