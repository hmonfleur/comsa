apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_CQRS
    service: gateway
  name: gateway
spec:
  template:
    metadata:
      labels:
        app: copy_CQRS
        service: gateway
    spec:
      hostname: gateway
      containers:
      - image: benwilcock/gateway-service
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: production
        ports:
        - containerPort: 8080
        name: gateway
      initContainers:
      - image: opsfleet/depends-on
        args:
        - -service=config
        - -service=discovery
        name: wait-for-services
  selector:
    matchLabels:
      app: copy_CQRS
      service: gateway
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_CQRS
    service: gateway
  name: gateway
spec:
  ports:
  - port: 8080
    name: port-8080
    targetPort: 8080
  selector:
    app: copy_CQRS
    service: gateway
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_CQRS
    service: gateway
  name: gateway
spec:
  rules:
  - http:
      paths:
      - path: /copy_CQRS/gateway
        backend:
          service:
            port:
              number: 8080
            name: gateway
        pathType: Prefix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_CQRS
    service: product-command-side
  name: product-command-side
spec:
  template:
    metadata:
      labels:
        app: copy_CQRS
        service: product-command-side
    spec:
      hostname: product-cmd-side
      containers:
      - image: benwilcock/product-command-side:latest
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: production
        ports:
        - containerPort: 9000
        name: product-command-side
      initContainers:
      - image: opsfleet/depends-on
        args:
        - -service=mongodb
        - -service=rabbitmq
        - -service=config
        - -service=discovery
        name: wait-for-services
  selector:
    matchLabels:
      app: copy_CQRS
      service: product-command-side
---
