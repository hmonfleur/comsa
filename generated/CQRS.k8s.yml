apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: copy_CQRS
    service: rabbitmq
  name: rabbitmq
spec:
  template:
    metadata:
      labels:
        app: copy_CQRS
        service: rabbitmq
    spec:
      hostname: rabbitmq
      containers:
      - image: rabbitmq:3-management
        securityContext:
          privileged: true
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: test
        - name: RABBITMQ_DEFAULT_PASS
          value: password
        ports:
        - containerPort: 5672
        - containerPort: 15672
        name: rabbitmq
  selector:
    matchLabels:
      app: copy_CQRS
      service: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: copy_CQRS
    service: rabbitmq
  name: rabbitmq
spec:
  ports:
  - port: 5672
    name: port-5672
    targetPort: 5672
  - port: 15672
    name: port-15672
    targetPort: 15672
  selector:
    app: copy_CQRS
    service: rabbitmq
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: copy_CQRS
    service: rabbitmq
  name: rabbitmq
spec:
  rules:
  - http:
      paths:
      - path: /copy_CQRS/rabbitmq
        backend:
          service:
            port:
              number: 5672
            name: rabbitmq
        pathType: Prefix
      - path: /copy_CQRS/rabbitmq
        backend:
          service:
            port:
              number: 15672
            name: rabbitmq
        pathType: Prefix

